<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>slab.cash — private access</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050506;
      --line: rgba(255, 255, 255, 0.08);
      --text: #ececee;
      --muted: #8c8e94;
      --green: #4ade80;
      --green-text: #5fe08d;
      --red: #f87171;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ---------- background video ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    .bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% 50%;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .bg video.ready { opacity: 1; }
    .bg::after {
      /* darken the left so the login text always reads, plus a soft vignette */
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 38%, rgba(0,0,0,0) 65%),
        radial-gradient(ellipse at 65% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
      pointer-events: none;
    }

    /* ---------- layout ---------- */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 32px clamp(16px, 6vw, 120px);
      transition: opacity .7s ease, filter .7s ease;
    }

    /* ---------- login column (no box, sits right on the video) ---------- */
    .panel {
      position: relative;
      width: min(431px, 100%);
      padding: 26px 50px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: panel-in .9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 9px;
      font: 400 11.5px/1 var(--mono);
      color: var(--muted);
      letter-spacing: .02em;
      margin-bottom: 28px;
    }
    .status-online .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(74,222,128,.7);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .45; } }

    .brand {
      font: 600 14px/1.2 var(--sans);
      color: #fff;
      letter-spacing: .005em;
    }
    .sub {
      margin-top: 6px;
      font: 400 14.5px/1.2 var(--mono);
      color: #9b9da2;
      letter-spacing: .04em;
    }

    form {
      width: 100%;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .prompt {
      width: 100%;
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(74,222,128,.42);
      background: rgba(22, 64, 36, .28);
      color: var(--green-text);
      font: 400 12px/1 var(--mono);
      letter-spacing: .03em;
      transition: color .25s, border-color .25s, background .25s;
    }
    .prompt .lock {
      width: 13px;
      height: 13px;
      margin-top: -2px; /* sits on the text baseline */
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
    }
    .prompt .lock rect { fill: currentColor; fill-opacity: .18; }
    .prompt .lock .hole { stroke-width: 1.6; }
    .prompt .lock .open { display: none; }
    .prompt.granted .lock .shut { display: none; }   /* unlocks on the right password */
    .prompt.granted .lock .open { display: inline; }
    .prompt.denied {
      color: var(--red);
      border-color: rgba(248,113,113,.5);
      background: rgba(80, 20, 20, .3);
    }
    .prompt.granted {
      color: #86efac;
      border-color: rgba(134,239,172,.75);
      background: rgba(30, 90, 50, .38);
      box-shadow: 0 0 18px rgba(74,222,128,.18);
    }

    /* solid fill + visible border so it reads as a text box over the busy video */
    .field-wrap { position: relative; width: 100%; margin-top: 10px; }
    .field {
      display: block;
      width: 100%;
      height: 39px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 0;
      background: rgba(12,13,15,.82);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
      color: var(--text);
      font: 400 14px/1 var(--mono);
      letter-spacing: .18em;
      text-align: center;
      caret-color: transparent; /* the blinking block below stands in for it */
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .field::placeholder { color: #75777d; letter-spacing: .08em; opacity: 1; }
    .field:hover { border-color: rgba(255,255,255,.36); }
    .field:focus {
      border-color: rgba(255,255,255,.55);
      background: rgba(14,15,18,.9);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.5), 0 0 0 3px rgba(255,255,255,.08);
    }
    .field.shake { border-color: rgba(248,113,113,.55); }
    .field-wrap:has(.field.shake) { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }

    /* blinking block cursor: an invisible copy of the text (or placeholder) pushes it to the end */
    .field-overlay {
      position: absolute;
      inset: 0;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      font: 400 14px/1 var(--mono);
      letter-spacing: .18em;
      white-space: pre;
    }
    .field-overlay.overflow { justify-content: flex-end; }
    .field-mirror { flex: none; color: transparent; }
    .field-mirror.ph { letter-spacing: .08em; }
    .field-caret {
      flex: none;
      width: 2px;
      height: 16px;
      margin: 0 -5px 0 3px; /* takes up no width, so the text stays centered like the input's */
      background: var(--text); /* same color as the typed text */
      animation: blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .field-wrap:has(.field:disabled) .field-caret { display: none; }
    @keyframes shake {
      15%, 85% { transform: translateX(-2px); }
      30%, 70% { transform: translateX(4px); }
      45%, 55% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
    }

    /* full-width, square and monospaced so it lines up with the prompt + field above */
    .btn {
      width: 100%;
      height: 39px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 0;
      background: #e8e8e9;
      color: #0a0b0c;
      font: 500 12px/1 var(--mono);
      letter-spacing: .16em;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      transition: background .18s, color .18s, box-shadow .18s, transform .1s, opacity .2s;
    }
    .btn .arrow { font-size: 13px; letter-spacing: 0; transition: transform .18s; }
    @media (hover: hover) {
      .btn:hover {
        background: var(--green);
        box-shadow: 0 0 0 1px rgba(74,222,128,.55), 0 0 26px rgba(74,222,128,.3);
      }
      .btn:hover .arrow { transform: translateX(4px); }
    }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.granted, .btn.granted:disabled {
      opacity: 1;
      background: var(--green);
      box-shadow: 0 0 0 1px rgba(134,239,172,.75), 0 0 26px rgba(74,222,128,.35);
    }
    .btn.granted .arrow { transform: translateX(4px); }


    /* ---------- sound toggle ---------- */
    .sound {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 28px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(8, 9, 11, .55);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font: 400 11px/1 var(--mono);
      letter-spacing: .03em;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .sound:hover { color: var(--text); border-color: rgba(255,255,255,.16); }
    .sound:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .sound .bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
    .sound .bars i {
      width: 2px; height: 3px;
      background: currentColor;
      transition: height .2s;
    }
    .sound.on { color: var(--green-text); }
    .sound.on .bars i { animation: eq 1s ease-in-out infinite; }
    .sound.on .bars i:nth-child(2) { animation-delay: -.35s; }
    .sound.on .bars i:nth-child(3) { animation-delay: -.7s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }

    /* ---------- exit transition ---------- */
    .fade {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease .35s;
    }
    body.leaving .fade { opacity: 1; }
    body.leaving .stage { opacity: 0; filter: blur(4px); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ---------- small screens: center the panel ---------- */
    @media (max-width: 720px) {
      .stage { justify-content: center; padding: 16px; }
      .panel { padding: 24px 22px 26px; }
      .bg::after { background: rgba(0,0,0,.45); }
    }
    @media (max-height: 640px) {
      body { overflow: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video id="bgv" src="gatesitebg2.mp4" autoplay muted loop playsinline preload="auto"></video>
  </div>

  <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Toggle sound">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLabel">sound off</span>
  </button>

  <main class="stage">
    <section class="panel" aria-labelledby="brand">
      <div class="status-online"><span class="dot"></span>online</div>

      <div class="brand" id="brand">slab.cash</div>
      <div class="sub">private access</div>

      <form id="gate" autocomplete="off" novalidate>
        <div class="prompt" id="prompt" role="status" aria-live="polite">
          <svg class="lock" viewBox="0 0 16 16" aria-hidden="true">
            <path class="shackle shut" d="M5 7.5V5a3 3 0 0 1 6 0v2.5" />
            <path class="shackle open" d="M5 7.5V5a3 3 0 0 1 5.8-1.1" />
            <rect x="3" y="7.5" width="10" height="7" rx="1.5" />
            <path class="hole" d="M8 10.3v1.6" />
          </svg>
          <span id="promptText">password protected</span>
        </div>
        <label for="pw" class="sr-only">Password</label>
        <div class="field-wrap">
          <input class="field" id="pw" name="pw" type="password" placeholder="type password here" autocomplete="current-password" spellcheck="false" autofocus />
          <div class="field-overlay" aria-hidden="true"><span class="field-mirror" id="pwMirror"></span><span class="field-caret"></span></div>
        </div>
        <button class="btn" id="go" type="submit"><span>continue</span><span class="arrow" aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>

  <div class="fade" aria-hidden="true"></div>

  <script>
    /* =========================================================
       CONFIG — change these two values
       ---------------------------------------------------------
       PASSWORD_HASH: SHA-256 of your password (default password: "slab").
         Make a new one in a terminal:
         node -e "console.log(require('crypto').createHash('sha256').update('YOUR PASSWORD').digest('hex'))"
       DESTINATION: where to go after the right password.
         A page in this folder ("home.html") or a full URL ("https://example.com").
       ========================================================= */
    const PASSWORD_HASH = "5643f1a80ea9af2d5f8478baf8ba292893c1b020ecabfbb43faa60c4c8b82f2e";
    const DESTINATION = "home.html";
    // Sound: leave SOUND_FILE empty to use the background video's own audio,
    // or put a file in this folder and name it here, e.g. "music.mp3".
    const SOUND_FILE = "";
    const SOUND_VOLUME = 1.0; // 0 to 1

    /* ---------- background video ---------- */
    const video = document.getElementById("bgv");
    const showVideo = () => video.classList.add("ready");
    if (video.readyState >= 2) showVideo(); else video.addEventListener("loadeddata", showVideo, { once: true });
    video.play().catch(() => {}); // some browsers need the nudge

    /* ---------- sound ----------
       Browsers block sound until the visitor interacts with the page,
       so it starts on their first click / key press (or via the toggle). */
    const sound = SOUND_FILE ? Object.assign(new Audio(SOUND_FILE), { loop: true, preload: "auto" }) : video;
    const soundBtn = document.getElementById("sound");
    const soundLabel = document.getElementById("soundLabel");
    let soundWanted = true;
    try { soundWanted = localStorage.getItem("slab_sound") !== "off"; } catch (_) {}

    const renderSound = (on) => {
      soundBtn.classList.toggle("on", on);
      soundBtn.setAttribute("aria-pressed", String(on));
      soundLabel.textContent = on ? "sound on" : "sound off";
    };
    const setSound = (on) => {
      if (on) {
        sound.volume = SOUND_VOLUME;
        sound.muted = false;
        sound.play().then(() => renderSound(true)).catch(() => renderSound(false));
      } else {
        if (sound === video) video.muted = true; else sound.pause();
        renderSound(false);
      }
    };

    const firstGesture = (e) => {
      if (e.target.closest && e.target.closest("#sound")) return; // the toggle handles itself
      ["pointerdown", "keydown", "touchstart"].forEach((t) => removeEventListener(t, firstGesture, true));
      if (soundWanted) setSound(true);
    };
    ["pointerdown", "keydown", "touchstart"].forEach((t) => addEventListener(t, firstGesture, true));

    soundBtn.addEventListener("click", () => {
      ["pointerdown", "keydown", "touchstart"].forEach((t) => removeEventListener(t, firstGesture, true));
      soundWanted = !soundBtn.classList.contains("on");
      try { localStorage.setItem("slab_sound", soundWanted ? "on" : "off"); } catch (_) {}
      setSound(soundWanted);
    });

    const fadeSoundOut = (ms) => {
      if (sound.muted || sound.paused) return;
      const start = sound.volume, t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / ms);
        sound.volume = start * (1 - k);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    /* ---------- SHA-256 (works everywhere, even without HTTPS) ---------- */
    function sha256(str) {
      const K = [], H = [];
      const frac = (x) => ((x - Math.floor(x)) * 0x100000000) | 0;
      for (let n = 2, c = 0; c < 64; n++) {
        let prime = true;
        for (let i = 2; i * i <= n; i++) if (n % i === 0) { prime = false; break; }
        if (!prime) continue;
        if (c < 8) H[c] = frac(Math.pow(n, 1 / 2));
        K[c++] = frac(Math.pow(n, 1 / 3));
      }
      const ror = (x, n) => (x >>> n) | (x << (32 - n));
      const bytes = new TextEncoder().encode(str);
      const len = bytes.length;
      const buf = new Uint8Array(((len + 9 + 63) >> 6) << 6);
      buf.set(bytes);
      buf[len] = 0x80;
      const dv = new DataView(buf.buffer);
      dv.setUint32(buf.length - 4, (len * 8) >>> 0);
      dv.setUint32(buf.length - 8, Math.floor((len * 8) / 0x100000000));
      const W = new Array(64);
      for (let off = 0; off < buf.length; off += 64) {
        for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4) | 0;
        for (let i = 16; i < 64; i++) {
          const a = W[i - 15], b = W[i - 2];
          const s0 = ror(a, 7) ^ ror(a, 18) ^ (a >>> 3);
          const s1 = ror(b, 17) ^ ror(b, 19) ^ (b >>> 10);
          W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let i = 0; i < 64; i++) {
          const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
          const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) | 0;
          h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
        H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
      }
      return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
    }

    /* ---------- gate logic ---------- */
    const form = document.getElementById("gate");
    const input = document.getElementById("pw");
    const btn = document.getElementById("go");
    const prompt = document.getElementById("prompt");
    const promptText = document.getElementById("promptText");
    let resetTimer;

    const PROMPT_DEFAULT = "password protected";
    const setPrompt = (text, state) => {
      promptText.textContent = text;
      prompt.classList.remove("denied", "granted");
      if (state) prompt.classList.add(state);
    };

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value;
      if (!value) { input.focus(); return; }
      clearTimeout(resetTimer);

      if (sha256(value) === PASSWORD_HASH) {
        setPrompt("access granted", "granted");
        btn.disabled = true;
        btn.classList.add("granted");
        input.disabled = true;
        try { sessionStorage.setItem("slab_access", "1"); } catch (_) {}
        setTimeout(() => { document.body.classList.add("leaving"); fadeSoundOut(800); }, 450);
        setTimeout(() => { window.location.href = DESTINATION; }, 1300);
      } else {
        setPrompt("access denied", "denied");
        input.classList.remove("shake");
        void input.offsetWidth; // restart the animation
        input.classList.add("shake");
        input.select();
        resetTimer = setTimeout(() => {
          setPrompt(PROMPT_DEFAULT);
          input.classList.remove("shake");
        }, 1800);
      }
    });

    /* keep the block cursor right after the typed dots (or the placeholder when empty) */
    const mirror = document.getElementById("pwMirror");
    const syncCaret = () => {
      const v = input.value;
      mirror.textContent = v ? "•".repeat([...v].length) : input.placeholder;
      mirror.classList.toggle("ph", !v);
      const overlay = mirror.parentElement;
      overlay.classList.remove("overflow");
      if (overlay.scrollWidth > overlay.clientWidth) overlay.classList.add("overflow");
    };
    syncCaret();
    document.fonts && document.fonts.ready.then(syncCaret);

    input.addEventListener("input", () => {
      syncCaret();
      if (prompt.classList.contains("denied")) {
        clearTimeout(resetTimer);
        setPrompt(PROMPT_DEFAULT);
        input.classList.remove("shake");
      }
    });

    // coming back via the browser's back button: reset the page
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) {
        document.body.classList.remove("leaving");
        btn.disabled = false; btn.classList.remove("granted"); input.disabled = false; input.value = ""; syncCaret();
        setPrompt(PROMPT_DEFAULT);
        sound.volume = SOUND_VOLUME;
      }
    });
  </script>
</body>
</html>
