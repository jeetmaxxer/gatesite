<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>slab.cash</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050506;
      --ink: #f2f0eb;          /* warm off-white, the monitor's plastic */
      --ink-2: #c4c2bc;        /* text people read */
      --muted: #8f8d88;        /* labels and meta */
      --line: rgba(242, 240, 235, .14);
      --danger: #ff9b8f;
      --r: 6px;
      --sans: "Mona Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ---------- background video ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    .bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% 50%;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .bg video.ready { opacity: 1; }
    .bg::after {
      /* darken the left so the login text always reads, plus a soft vignette */
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 38%, rgba(0,0,0,0) 65%),
        radial-gradient(ellipse at 65% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
      pointer-events: none;
    }

    /* ---------- layout ---------- */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 32px clamp(16px, 6vw, 120px);
      transition: opacity .7s ease, filter .7s ease;
    }

    /* ---------- login column (no box, sits right on the video) ---------- */
    .panel {
      position: relative;
      width: min(360px, 100%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: panel-in .9s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .label {
      margin-bottom: 8px;
      font: 500 14px/1 var(--sans);
      color: var(--ink-2);
    }

    /* solid fill + visible border so it reads as a text box over the busy video */
    .field-wrap { position: relative; width: 100%; }
    .field {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid rgba(242,240,235,.22);
      border-radius: var(--r);
      background: rgba(10,10,11,.72);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--ink);
      font: 400 16px/1 var(--mono);
      letter-spacing: .12em;
      caret-color: transparent; /* the blinking bar below stands in for it */
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field:hover { border-color: rgba(242,240,235,.34); }
    .field:focus {
      border-color: rgba(242,240,235,.72);
      box-shadow: 0 0 0 3px rgba(242,240,235,.14);
    }
    .field[aria-invalid="true"] { border-color: var(--danger); }
    .field-wrap.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
    @keyframes shake {
      15%, 85% { transform: translateX(-2px); }
      30%, 70% { transform: translateX(4px); }
      45%, 55% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
    }

    /* blinking bar cursor: an invisible copy of the typed dots pushes it to the end */
    .field-overlay {
      position: absolute;
      inset: 0;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      pointer-events: none;
      font: 400 16px/1 var(--mono);
      letter-spacing: .12em;
      white-space: pre;
    }
    .field-overlay.overflow { justify-content: flex-end; }
    .field-mirror { flex: none; color: transparent; }
    .field-caret {
      flex: none;
      width: 2px;
      height: 18px;
      margin-left: 1px;
      background: var(--ink); /* same color as the typed text */
      animation: blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .field-wrap:has(.field:disabled) .field-caret { display: none; }

    .btn {
      width: 100%;
      height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: var(--r);
      background: var(--ink);
      color: #121211;
      font: 600 16px/1 var(--sans);
      cursor: pointer;
      transition: background .15s, transform .12s, opacity .2s;
    }
    @media (hover: hover) {
      .btn:hover { background: #fff; transform: translateY(-1px); }
    }
    .btn:active { transform: translateY(0) scale(.985); }
    .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .btn:disabled { cursor: default; transform: none; }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      font: 400 14px/1.4 var(--sans);
      color: var(--ink-2);
    }
    .status.error { color: var(--danger); }

    /* ---------- sound toggle ---------- */
    .sound {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: rgba(8, 9, 11, .55);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font: 500 13px/1 var(--sans);
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .sound:hover { color: var(--ink); border-color: rgba(242,240,235,.26); }
    .sound:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .sound .bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
    .sound .bars i {
      width: 2px; height: 3px;
      background: currentColor;
      transition: height .2s;
    }
    .sound.on { color: var(--ink); }
    .sound.on .bars i { animation: eq 1s ease-in-out infinite; }
    .sound.on .bars i:nth-child(2) { animation-delay: -.35s; }
    .sound.on .bars i:nth-child(3) { animation-delay: -.7s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }

    /* ---------- exit transition ---------- */
    .fade {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease .35s;
    }
    body.leaving .fade { opacity: 1; }
    body.leaving .stage { opacity: 0; filter: blur(4px); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ---------- small screens: center the panel ---------- */
    @media (max-width: 720px) {
      .stage { justify-content: center; padding: 24px 20px; }
      .bg::after { background: rgba(0,0,0,.45); }
    }
    @media (max-height: 640px) {
      body { overflow: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video id="bgv" src="gatesitebg3.mp4" autoplay muted loop playsinline preload="auto"></video>
  </div>

  <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Toggle sound">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLabel">Sound off</span>
  </button>

  <main class="stage">
    <section class="panel" id="panel" aria-labelledby="brand">
      <h1 class="sr-only" id="brand">slab.cash</h1>

      <form id="gate" autocomplete="off" novalidate>
        <label for="pw" class="label">Password</label>
        <div class="field-wrap" id="fieldWrap">
          <input class="field" id="pw" name="pw" type="password" autocomplete="current-password" spellcheck="false" autofocus aria-describedby="status" />
          <div class="field-overlay" aria-hidden="true"><span class="field-mirror" id="pwMirror"></span><span class="field-caret"></span></div>
        </div>
        <button class="btn" id="go" type="submit">Enter site</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <div class="fade" aria-hidden="true"></div>

  <script>
    /* =========================================================
       CONFIG — change these two values
       ---------------------------------------------------------
       PASSWORD_HASH: SHA-256 of your password (default password: "slab").
         Make a new one in a terminal:
         node -e "console.log(require('crypto').createHash('sha256').update('YOUR PASSWORD').digest('hex'))"
       DESTINATION: where to go after the right password.
         A page in this folder ("home.html") or a full URL ("https://example.com").
       ========================================================= */
    const PASSWORD_HASH = "5643f1a80ea9af2d5f8478baf8ba292893c1b020ecabfbb43faa60c4c8b82f2e";
    const DESTINATION = "home.html";
    // Sound: leave SOUND_FILE empty to use the background video's own audio,
    // or put a file in this folder and name it here, e.g. "music.mp3".
    const SOUND_FILE = "";
    const SOUND_VOLUME = 1.0; // 0 to 1

    /* ---------- background video ---------- */
    const video = document.getElementById("bgv");
    const showVideo = () => video.classList.add("ready");
    if (video.readyState >= 2) showVideo(); else video.addEventListener("loadeddata", showVideo, { once: true });
    video.play().catch(() => {}); // some browsers need the nudge

    /* ---------- sound ----------
       Browsers block sound until the visitor interacts with the page,
       so it starts on their first click / key press (or via the toggle). */
    const sound = SOUND_FILE ? Object.assign(new Audio(SOUND_FILE), { loop: true, preload: "auto" }) : video;
    const soundBtn = document.getElementById("sound");
    const soundLabel = document.getElementById("soundLabel");
    let soundWanted = true;
    try { soundWanted = localStorage.getItem("slab_sound") !== "off"; } catch (_) {}

    const renderSound = (on) => {
      soundBtn.classList.toggle("on", on);
      soundBtn.setAttribute("aria-pressed", String(on));
      soundLabel.textContent = on ? "Sound on" : "Sound off";
    };
    const setSound = (on) => {
      if (on) {
        sound.volume = SOUND_VOLUME;
        sound.muted = false;
        sound.play().then(() => renderSound(true)).catch(() => renderSound(false));
      } else {
        if (sound === video) video.muted = true; else sound.pause();
        renderSound(false);
      }
    };

    const firstGesture = (e) => {
      if (e.target.closest && e.target.closest("#sound")) return; // the toggle handles itself
      ["pointerdown", "keydown", "touchstart"].forEach((t) => removeEventListener(t, firstGesture, true));
      if (soundWanted) setSound(true);
    };
    ["pointerdown", "keydown", "touchstart"].forEach((t) => addEventListener(t, firstGesture, true));

    soundBtn.addEventListener("click", () => {
      ["pointerdown", "keydown", "touchstart"].forEach((t) => removeEventListener(t, firstGesture, true));
      soundWanted = !soundBtn.classList.contains("on");
      try { localStorage.setItem("slab_sound", soundWanted ? "on" : "off"); } catch (_) {}
      setSound(soundWanted);
    });

    const fadeSoundOut = (ms) => {
      if (sound.muted || sound.paused) return;
      const start = sound.volume, t0 = performance.now();
      const step = (now) => {
        const k = Math.min(1, (now - t0) / ms);
        sound.volume = start * (1 - k);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    /* ---------- SHA-256 (works everywhere, even without HTTPS) ---------- */
    function sha256(str) {
      const K = [], H = [];
      const frac = (x) => ((x - Math.floor(x)) * 0x100000000) | 0;
      for (let n = 2, c = 0; c < 64; n++) {
        let prime = true;
        for (let i = 2; i * i <= n; i++) if (n % i === 0) { prime = false; break; }
        if (!prime) continue;
        if (c < 8) H[c] = frac(Math.pow(n, 1 / 2));
        K[c++] = frac(Math.pow(n, 1 / 3));
      }
      const ror = (x, n) => (x >>> n) | (x << (32 - n));
      const bytes = new TextEncoder().encode(str);
      const len = bytes.length;
      const buf = new Uint8Array(((len + 9 + 63) >> 6) << 6);
      buf.set(bytes);
      buf[len] = 0x80;
      const dv = new DataView(buf.buffer);
      dv.setUint32(buf.length - 4, (len * 8) >>> 0);
      dv.setUint32(buf.length - 8, Math.floor((len * 8) / 0x100000000));
      const W = new Array(64);
      for (let off = 0; off < buf.length; off += 64) {
        for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4) | 0;
        for (let i = 16; i < 64; i++) {
          const a = W[i - 15], b = W[i - 2];
          const s0 = ror(a, 7) ^ ror(a, 18) ^ (a >>> 3);
          const s1 = ror(b, 17) ^ ror(b, 19) ^ (b >>> 10);
          W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let i = 0; i < 64; i++) {
          const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
          const ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
          const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) | 0;
          h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
        H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
      }
      return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
    }

    /* ---------- gate logic ---------- */
    const form = document.getElementById("gate");
    const input = document.getElementById("pw");
    const btn = document.getElementById("go");
    const fieldWrap = document.getElementById("fieldWrap");
    const status = document.getElementById("status");

    const setStatus = (text, isError) => {
      status.textContent = text;
      status.classList.toggle("error", !!isError);
      if (isError) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
    };

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value;
      if (!value) { setStatus("Type the password first.", true); input.focus(); return; }

      if (sha256(value) === PASSWORD_HASH) {
        setStatus("Unlocking…");
        btn.disabled = true;
        input.disabled = true;
        try { sessionStorage.setItem("slab_access", "1"); } catch (_) {}
        setTimeout(() => { document.body.classList.add("leaving"); fadeSoundOut(800); }, 450);
        setTimeout(() => { window.location.href = DESTINATION; }, 1300);
      } else {
        setStatus("That password didn’t work. Try again.", true);
        fieldWrap.classList.remove("shake");
        void fieldWrap.offsetWidth; // restart the animation
        fieldWrap.classList.add("shake");
        input.select();
      }
    });

    /* keep the bar cursor right after the typed dots */
    const mirror = document.getElementById("pwMirror");
    const syncCaret = () => {
      mirror.textContent = "\u2022".repeat([...input.value].length);
      const overlay = mirror.parentElement;
      overlay.classList.remove("overflow");
      if (overlay.scrollWidth > overlay.clientWidth) overlay.classList.add("overflow");
    };
    syncCaret();
    document.fonts && document.fonts.ready.then(syncCaret);

    // typing again clears the error
    input.addEventListener("input", () => {
      syncCaret();
      if (status.classList.contains("error")) setStatus("");
    });

    // coming back via the browser's back button: reset the page
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) {
        document.body.classList.remove("leaving");
        btn.disabled = false; input.disabled = false; input.value = ""; syncCaret();
        setStatus("");
        sound.volume = SOUND_VOLUME;
      }
    });
  </script>
</body>
</html>
